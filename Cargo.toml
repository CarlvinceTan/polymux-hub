[package]
name = "hub-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hub"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
lto = "thin"
